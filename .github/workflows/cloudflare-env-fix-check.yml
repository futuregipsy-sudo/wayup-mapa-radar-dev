name: Cloudflare credentials fix - isolated verification
on:
  push:
    branches:
      - fix/cloudflare-secret-reading
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Production build (no deploy)
        run: npm run build
      - name: TypeScript check
        run: npx tsc --noEmit
