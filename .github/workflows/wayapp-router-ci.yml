name: WAYAPP Router isolated CI
on:
  push:
    branches:
      - feature/wayapp-ai-router-designer
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test -- --run
      - name: Build without deployment
        run: npm run build
